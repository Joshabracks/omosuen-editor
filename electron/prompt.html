<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prompt</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; font: 13px/1.4 system-ui, sans-serif;
      background: #1e1f24; color: #e8e8ea;
      display: flex; flex-direction: column; height: 100vh;
      padding: 16px; box-sizing: border-box; gap: 12px;
    }
    label { color: #9a9ca3; }
    input {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #2c2e33; border-radius: 4px;
      background: #121316; color: inherit; font: inherit;
    }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: auto; }
    button {
      appearance: none; border: 1px solid #2c2e33; background: #2a2c31;
      color: inherit; font: inherit; padding: 6px 14px; cursor: pointer; border-radius: 4px;
    }
    button.primary { background: #3a5f9a; border-color: #4a6fad; }
  </style>
</head>
<body>
  <label for="value" id="label">Value</label>
  <input id="value" type="text" autofocus />
  <div class="actions">
    <button type="button" id="cancel">Cancel</button>
    <button type="button" class="primary" id="ok">OK</button>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const channel = params.get('channel') || '';
    const input = document.getElementById('value');
    document.getElementById('label').textContent = params.get('label') || 'Value';
    document.title = params.get('title') || 'Prompt';
    document.getElementById('ok').textContent = params.get('okLabel') || 'OK';
    input.value = params.get('defaultValue') || '';
    const submit = (value) => window.omosuenPrompt.submit(channel, value);
    document.getElementById('ok').onclick = () => { void submit(input.value); };
    document.getElementById('cancel').onclick = () => { void submit(null); };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); void submit(input.value); }
      if (e.key === 'Escape') { e.preventDefault(); void submit(null); }
    });
    input.focus();
    input.select();
  </script>
</body>
</html>
